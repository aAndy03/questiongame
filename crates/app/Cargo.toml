[package]
name = "questiongame-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# The binary is `questiongame`; the library is what the tests link against, so
# everything worth testing lives above `main.rs` rather than inside it.
[lib]
name = "questiongame_app"
path = "src/lib.rs"

[[bin]]
name = "questiongame"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
questiongame-host = { path = "../host" }
tauri = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
fs4 = { workspace = true }
sysinfo = { workspace = true }
rfd = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
ureq = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
semver = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The display topology tao does not see (beta.10, `topology_mac`): each
# display's localized name, mirror sets, "Displays have separate Spaces". All
# already in the lockfile through tao.
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSGraphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSValue", "NSDictionary", "NSArray", "NSEnumerator"] }

[target.'cfg(windows)'.dependencies]
# `QueryDisplayConfig`: the display topology Tauri's `available_monitors` does
# not see — EDID names, Duplicate groups, and connected panels Windows is not
# using (`monitors::topology`).
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Gdi"] }
